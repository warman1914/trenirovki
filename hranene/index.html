<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Хранене</title>
<meta name="theme-color" content="#16804f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Хранене">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky header + tabs; today's totals first, then meal slots; add-food sheet slides over the page. */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --stage:#e7efea; --ink:#14211b; --muted:#5a6b62;
  --line:#d6e1db; --accent:#14804d; --accent-soft:#dbefe4; --ok:#14804d; --warn:#b4560a; --over:#b8322a; --band:#14804d22;
  --display:"Oswald","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1512; --surface:#16211c; --stage:#1c2a23; --ink:#e5eee9; --muted:#97aaa0;
    --line:#283a31; --accent:#3cc483; --accent-soft:#183528; --ok:#3cc483; --warn:#f0a35c; --over:#ff7a6e; --band:#3cc48322; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1512; --surface:#16211c; --stage:#1c2a23; --ink:#e5eee9; --muted:#97aaa0;
  --line:#283a31; --accent:#3cc483; --accent-soft:#183528; --ok:#3cc483; --warn:#f0a35c; --over:#ff7a6e; --band:#3cc48322; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-bottom:calc(40px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
body.sheet-open{overflow:hidden}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top{max-width:860px;margin:0 auto;padding:12px 16px 8px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.top h1{font-size:26px;line-height:1}
.top a{font-size:14px;color:var(--muted);text-decoration:none}
nav{max-width:860px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{font:600 15px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 15px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:860px;margin:0 auto;padding:16px;display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:12px}
.panel>*{min-width:0}
.panel h3{font-size:20px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted);font-size:14px}
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datenav h2{font-size:24px;text-align:center;flex:1}
.iconbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 20px var(--body);cursor:pointer}
.iconbtn:disabled{opacity:.35;cursor:default}
.left{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.left b{font:600 40px/1 var(--display);font-variant-numeric:tabular-nums}
.left span{color:var(--muted)}
.left.over b{color:var(--over)}
.bars{display:grid;gap:10px}
.bar{display:grid;gap:4px}
.bar .lab{display:flex;justify-content:space-between;font-size:14px;font-variant-numeric:tabular-nums}
.bar .lab b{font-weight:600}
.track{position:relative;height:10px;border-radius:6px;background:var(--stage);overflow:hidden}
.track .band{position:absolute;top:0;bottom:0;background:var(--band);border-left:2px solid var(--accent);border-right:2px solid var(--accent)}
.track .fill{position:absolute;left:0;top:0;bottom:0;background:var(--muted);border-radius:6px}
.track .fill.in{background:var(--ok)}
.track .fill.over{background:var(--over)}
.minor{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.water{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font:600 16px var(--body);background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:14px}
.btn.danger{background:var(--warn)}
.btn:disabled{opacity:.4}
.slot-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slot-h h3{font-size:20px}
.slot-h .sum{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.items{display:grid}
.item{display:grid;grid-template-columns:1fr auto 36px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .nm{font-size:15px;background:none;border:0;color:var(--ink);text-align:left;padding:0;font-family:var(--body);cursor:pointer}
.item .nm small{display:block;color:var(--muted);font-size:13px}
.item .kc{font-size:14px;font-variant-numeric:tabular-nums;text-align:right}
.item .kc small{display:block;color:var(--muted);font-size:12px}
.item .del{width:36px;height:36px;border-radius:8px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--stage);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font:600 22px var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:12px var(--body)}
.chart .grid{stroke:var(--line)}
.chart .bandr{fill:var(--band)}
.chart .b{fill:var(--accent)}
.chart .b.over{fill:var(--over)}
.chart .b.under{fill:var(--muted);opacity:.6}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500}
td.r,th.r{text-align:right}
.tbl{overflow-x:auto}
input,select,textarea{font:500 16px var(--body);padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input.num{width:92px;font-variant-numeric:tabular-nums}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.form .wide{grid-column:1/-1}
details summary{cursor:pointer}
ul.tips{margin:0;padding-left:18px;display:grid;gap:4px}
a{color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.on{display:block}
#sheet .scrim{position:absolute;inset:0;background:#0008}
#sheet .box{position:absolute;left:0;right:0;bottom:0;top:calc(40px + env(safe-area-inset-top));background:var(--bg);border-radius:16px 16px 0 0;display:flex;flex-direction:column;max-width:860px;margin:0 auto}
#sheet .sh{padding:14px 16px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
#sheet .sh .t{display:flex;justify-content:space-between;align-items:center}
#sheet .sh h2{font-size:22px}
#sheet .sb{overflow-y:auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom));flex:1;-webkit-overflow-scrolling:touch}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 14px var(--body);border-radius:999px;padding:6px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.search{width:100%}
.res{display:grid}
.res .r{display:grid;grid-template-columns:1fr 40px;align-items:center;border-bottom:1px solid var(--line)}
.res .pick{background:none;border:0;text-align:left;padding:10px 0;color:var(--ink);font:15px var(--body);cursor:pointer}
.res .pick small{display:block;color:var(--muted);font-size:13px}
.res .star{background:none;border:0;font-size:20px;color:var(--muted);cursor:pointer;height:40px}
.res .star[aria-pressed="true"]{color:#e0a100}
.portion{display:grid;gap:12px;padding-top:8px}
.portion h3{font-size:20px}
.preview{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
.preview div{background:var(--stage);border-radius:8px;padding:8px 4px}
.preview b{display:block;font:600 18px var(--display);font-variant-numeric:tabular-nums}
.preview span{font-size:12px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;display:none;z-index:30;max-width:90vw;text-align:center}
</style>
</head>
<body>
<header>
  <div class="top"><h1>Хранене</h1><a href="../">Тренировки →</a></div>
  <nav id="tabs" role="tablist" aria-label="Раздели"></nav>
</header>
<main id="main"></main>
<div id="sheet" aria-hidden="true">
  <div class="scrim" data-close></div>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sh">
      <div class="t"><h2 id="sheet-title">Добави храна</h2><button type="button" class="iconbtn" data-close aria-label="Затвори">×</button></div>
      <div class="chips" id="slotchips"></div>
      <input class="search" id="q" type="search" placeholder="Търси: пилешко, леща, скир…" autocomplete="off" aria-label="Търси храна">
      <div class="chips" id="modechips"></div>
    </div>
    <div class="sb" id="sheetbody"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="foods.js"></script>
<script src="app.js"></script>
</body>
</html>
