<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренировки</title>
<meta name="theme-color" content="#1554c8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Тренировки">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky header with tabs; one column of cards on phone, two on wide screens; fixed rest bar at the bottom. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --stage:#e8eef5; --ink:#141f2b; --muted:#5a6878;
  --line:#d8e0e8; --accent:#1660d6; --accent-soft:#dfeafc; --eq:#9eacba; --ok:#1d8a4a; --warn:#b4560a;
  --display:"Oswald","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1419; --surface:#162029; --stage:#1c2833; --ink:#e6ecf1; --muted:#97a6b4;
    --line:#293643; --accent:#4d8ff0; --accent-soft:#18304f; --eq:#56687b; --ok:#45bf78; --warn:#f0a35c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1419; --surface:#162029; --stage:#1c2833; --ink:#e6ecf1; --muted:#97a6b4;
  --line:#293643; --accent:#4d8ff0; --accent-soft:#18304f; --eq:#56687b; --ok:#45bf78; --warn:#f0a35c; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-bottom:calc(100px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top{max-width:1040px;margin:0 auto;padding:12px 16px 8px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top h1{font-size:26px;line-height:1}
.next{font-size:14px;color:var(--muted)}
.next b{color:var(--accent);font-weight:600}
.next a{color:var(--muted)}
nav{max-width:1040px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{font:600 15px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 15px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}
main{max-width:1040px;margin:0 auto;padding:18px 16px}
.intro{display:grid;gap:6px;margin-bottom:16px}
.intro h2{font-size:30px}
.intro p{margin:0;color:var(--muted);max-width:68ch}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:760px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.stage{background:var(--stage);position:relative;cursor:pointer}
.stage svg{display:block;width:100%;height:auto;aspect-ratio:180/150}
.num{position:absolute;top:10px;left:10px;font:600 15px var(--display);background:var(--surface);color:var(--ink);border-radius:8px;padding:2px 9px}
.paused{position:absolute;top:10px;right:10px;font-size:12px;color:var(--muted);background:var(--surface);border-radius:6px;padding:2px 7px;display:none}
.stage.is-paused .paused{display:block}
.body{padding:14px 16px 16px;display:grid;gap:10px}
.body h3{font-size:20px;line-height:1.15}
.alt{font-size:13px;color:var(--muted);margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:500;border-radius:6px;padding:3px 8px;background:var(--stage);color:var(--ink);font-variant-numeric:tabular-nums}
.chip.ss{background:var(--accent-soft);color:var(--accent)}
.chip.up{background:var(--ok);color:#fff}
.cues{margin:0;padding-left:18px;display:grid;gap:3px;font-size:14.5px}
.sets{display:grid;gap:6px;border-top:1px dashed var(--line);padding-top:10px}
.setrow{display:grid;grid-template-columns:28px 1fr auto 1fr 46px;gap:6px;align-items:center}
.setrow.nokg{grid-template-columns:28px 1fr 46px}
.setrow .n{font:600 15px var(--display);color:var(--muted);text-align:center}
.setrow .x{color:var(--muted);font-size:14px}
.fld{position:relative}
.fld input{width:100%;font:500 17px var(--body);padding:9px 34px 9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.fld span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.ok{width:46px;height:42px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--muted);font:600 18px var(--body);cursor:pointer}
.setrow.done .ok{background:var(--ok);border-color:var(--ok);color:#fff}
.setrow.done input{border-color:var(--ok)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,.stage:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{font:600 16px var(--body);background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 18px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:14px}
.btn.danger{background:var(--warn)}
.finish{margin-top:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted);font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:12px}
.panel h3{font-size:20px}
.panel>*{min-width:0}
select{max-width:100%;width:100%}
.stack{display:grid;gap:16px;max-width:820px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi{background:var(--stage);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font:600 22px var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:12px var(--body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ln2{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}
.chart .pt{fill:var(--accent)}
.chart .pt2{fill:var(--muted);opacity:.55}
.chart .area{fill:var(--accent);opacity:.08}
.chart .tgt{stroke:var(--ok);stroke-width:1.5;stroke-dasharray:6 4}
.chart .lbl{fill:var(--ink);font-weight:600}
select,.inp{font:500 16px var(--body);padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.inp{width:110px;font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500}
.tbl{overflow-x:auto}
.rules ul{margin:0;padding-left:18px;display:grid;gap:4px}
.rules a,.panel a{color:var(--accent)}
#rest{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--ink);color:var(--bg);transform:translateY(110%);transition:transform .25s;padding-bottom:env(safe-area-inset-bottom)}
#rest.on{transform:none}
#rest .in{max-width:1040px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
#rest .t{font:600 30px var(--display);font-variant-numeric:tabular-nums;min-width:72px}
#rest .lbl{font-size:14px;opacity:.8;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rest button{font:600 14px var(--body);background:transparent;color:var(--bg);border:1px solid currentColor;border-radius:8px;padding:8px 10px;cursor:pointer}
#rest .bar{height:4px;background:var(--accent);width:100%;transform-origin:left}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;display:none;z-index:11;max-width:90vw;text-align:center}
/* figure */
.floor{stroke:var(--line);stroke-width:2}
.limb{stroke:var(--ink);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none}
.limb.far{stroke:var(--muted);opacity:.5;stroke-width:6}
.torso{stroke:var(--ink);stroke-width:11;stroke-linecap:round;fill:none}
.torso-f{fill:var(--ink);stroke:var(--ink);stroke-width:6;stroke-linejoin:round}
.headc{fill:var(--ink)}
.eq{fill:var(--eq)}
.eqs{stroke:var(--eq);fill:none;stroke-linecap:round}
.cable{stroke:var(--eq);stroke-width:1.6;fill:none;stroke-dasharray:3 2}
.db{fill:var(--accent)}
.figghost{opacity:.28}
@media (prefers-reduced-motion:reduce){#rest{transition:none}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Тренировки</h1>
    <div class="next" id="next"></div>
  </div>
  <nav id="tabs" role="tablist" aria-label="Раздели"></nav>
</header>
<main id="main"></main>

<div id="rest" role="status" aria-live="polite">
  <div class="bar" id="restbar"></div>
  <div class="in">
    <div class="t" id="restt">1:30</div>
    <div class="lbl" id="restl">Почивка</div>
    <button type="button" id="rest15">+15 с</button>
    <button type="button" id="restskip">Пропусни</button>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="figures.js"></script>
<script src="app.js"></script>
</body>
</html>
